<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RHMRA Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14161a; --panel:#1d2026; --line:#2c3037; --text:#d7dae0; --dim:#8a8f98;
          --green:#4cc38a; --red:#e5534b; --amber:#d4a72c;
          /* same saturation/lightness as --green, hue rotated to blue */
          --blue:#4c8ac3; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--text);
         font:14px/1.5 system-ui, "Segoe UI", sans-serif; padding:24px; }
  h1 { font-size:18px; font-weight:600; }
  h2 { font-size:13px; font-weight:600; color:var(--dim);
       text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  header { display:flex; align-items:baseline; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .pill { font-size:12px; padding:2px 10px; border-radius:10px;
          background:var(--panel); border:1px solid var(--line); color:var(--dim); }
  .pill.stale { color:var(--amber); border-color:var(--amber); }
  .pill.dry-mode { color:var(--green); border-color:var(--green); }
  .pill.live-mode { display:inline-block; color:var(--red); border-color:var(--red);
                    transform-origin:center;
                    animation:live-sign-spin 4.5s ease-in-out infinite;
                    will-change:transform; }
  @keyframes live-sign-spin {
    0%, 55% { transform:perspective(140px) rotateY(0deg); }
    85%, 100% { transform:perspective(140px) rotateY(360deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .pill.live-mode { animation:none; }
  }
  section { background:var(--panel); border:1px solid var(--line); border-radius:8px;
            padding:16px; margin-bottom:16px; }
  .cards { display:flex; gap:24px; flex-wrap:wrap; }
  .card .v { font-size:22px; font-weight:600; }
  .card .k { font-size:12px; color:var(--dim); }
  table { border-collapse:collapse; width:100%; }
  th, td { text-align:right; padding:6px 10px; border-bottom:1px solid var(--line);
           font-variant-numeric:tabular-nums; white-space:nowrap; }
  th { color:var(--dim); font-weight:500; font-size:12px; }
  th:first-child, td:first-child { text-align:left; }
  .pos { color:var(--green); } .neg { color:var(--red); }
  .badge { font-size:11px; padding:1px 8px; border-radius:8px; }
  .badge.ok { background:#1c3529; color:var(--green); }
  .badge.warn { background:#3a1f1d; color:var(--red); font-weight:600; }
  .profit-stars { display:inline-block; margin-right:6px; font-size:12px;
                  line-height:0; letter-spacing:-2px; vertical-align:1px;
                  white-space:nowrap; }
  .show-more-eras { display:block; margin:12px auto 0; padding:5px 12px;
                    border:1px solid var(--blue); border-radius:6px;
                    background:transparent; color:var(--text); font:inherit;
                    cursor:pointer; }
  .show-more-eras:hover { background:#232a33; }
  .show-more-eras:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
  .empty { color:var(--dim); font-style:italic; }
  .error { background:#3a1f1d; border-color:var(--red); color:var(--red); }
  .hint { text-transform:none; letter-spacing:0; font-weight:400; }
  .runs { display:flex; gap:6px; flex-wrap:wrap; }
  /* every run gets the same treatment — a run that skipped the scan still ran */
  .run { display:inline-flex; flex-direction:column; align-items:center; gap:2px;
         padding:4px 10px; border-radius:6px; border:1px solid var(--blue); cursor:default; }
  .run .t { font-size:12px; font-weight:600; color:var(--text); }
  .run .o { font-size:11px; color:var(--dim); white-space:nowrap; }
  /* the one exception: a tripped guard is an alert, not a routine outcome */
  .run.halted { border-color:var(--red); }
  .run.halted .t { color:var(--red); }
</style>
</head>
<body>
<header>
  <h1>RHMRA Dashboard</h1>
  <span id="mode" class="pill">loading…</span>
  <span id="staleness" class="pill"></span>
  <span id="rules" class="pill"></span>
  <span id="updated" class="pill"></span>
</header>

<div id="banner"></div>

<section>
  <h2>Account</h2>
  <div class="cards" id="account"><span class="empty">no snapshot yet</span></div>
</section>

<section>
  <h2>Positions</h2>
  <div id="positions"><span class="empty">no snapshot yet</span></div>
</section>

<section>
  <h2>Runs today <span class="hint">— every run listed executed; the label is what its <em>entry phase</em> did</span></h2>
  <div class="runs" id="runs"><span class="empty">no snapshots yet</span></div>
</section>

<section>
  <h2>Realized P&amp;L by rules era (from trade ledger)</h2>
  <div id="eras"><span class="empty">no ledger data</span></div>
</section>

<script>
"use strict";
const $ = id => document.getElementById(id);
const fmt$ = n => typeof n === "number" && Number.isFinite(n)
  ? (n < 0 ? "-$" : "$") + Math.abs(n).toFixed(2)
  : "unavailable";
const cls = n => typeof n === "number" && Number.isFinite(n)
  ? (n > 0 ? "pos" : n < 0 ? "neg" : "")
  : "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const getJSON = u => fetch(u, { cache: "no-store" }).then(r => r.json());
const sgn$ = n => (n > 0 ? "+" : n < 0 ? "-" : "") + "$" + Math.abs(n).toFixed(2);
const ERA_ROW_LIMIT = 12;
let erasExpanded = false;
let eraDateSignature = null;

function banner(msg) {
  $("banner").innerHTML = `<section class="error">${esc(msg)}</section>`;
}

function renderMode(config) {
  const mode = $("mode");
  if (typeof config.dry_run !== "boolean") {
    mode.textContent = "UNKNOWN";
    mode.className = "pill";
    banner(config.error || "Current DRY_RUN setting is unavailable.");
    return;
  }
  mode.textContent = config.dry_run ? "DRY" : "LIVE";
  mode.className = "pill " + (config.dry_run ? "dry-mode" : "live-mode");
  mode.title = "Current constants.md setting";
}

function renderSnapshot(snap) {
  if (snap.schema_version !== 1) {
    banner(`Snapshot schema_version ${esc(snap.schema_version)} is not supported by this dashboard (expects 1). Refusing to render it — update dashboard/index.html.`);
    return;
  }
  $("rules").textContent = "rules " + snap.rules_version;

  const ageMin = Math.round((Date.now() - new Date(snap.run_start_pt).getTime()) / 60000);
  $("staleness").textContent = `snapshot ${ageMin} min old (${snap.session})`;
  $("staleness").className = "pill" + (ageMin > 45 ? " stale" : "");

  const unreal = snap.positions.reduce((s, p) => s + (p.current_price - p.avg_buy_price) * p.quantity, 0);
  const a = snap.account;
  $("account").innerHTML = [
    ["Total value", fmt$(a.total_value), ""],
    ["Cash", fmt$(a.cash), ""],
    ["Buying power", fmt$(a.buying_power), ""],
    ["Realized today", fmt$(snap.realized_pnl_today), cls(snap.realized_pnl_today)],
    ["Unrealized", fmt$(unreal), cls(unreal)],
  ].map(([k, v, c]) => `<div class="card"><div class="v ${c}">${v}</div><div class="k">${k}</div></div>`).join("");

  if (!snap.positions.length) {
    $("positions").innerHTML = `<span class="empty">account is flat — no open positions</span>`;
    return;
  }
  const rows = snap.positions.map(p => {
    const pnl = (p.current_price - p.avg_buy_price) * p.quantity;
    const pct = (p.current_price / p.avg_buy_price - 1) * 100;
    const protectedStop = p.stop_price != null && (p.stop_state === "confirmed" || p.stop_state === "queued");
    const dist = protectedStop ? ((p.current_price - p.stop_price) / p.current_price * 100).toFixed(2) + "%" : "—";
    const stopBadge = protectedStop
      ? `<span class="badge ok">${esc(p.stop_state)} @ $${p.stop_price.toFixed(2)}</span>`
      : `<span class="badge warn">UNPROTECTED</span>`;
    return `<tr><td>${esc(p.symbol)}</td><td>${p.quantity}</td>
      <td>$${p.avg_buy_price.toFixed(4)}</td><td>$${p.current_price.toFixed(4)}</td>
      <td class="${cls(pnl)}">${fmt$(pnl)} (${pct.toFixed(2)}%)</td>
      <td>${stopBadge}</td><td>${dist}</td></tr>`;
  }).join("");
  $("positions").innerHTML = `<table><tr><th>Symbol</th><th>Qty</th><th>Avg buy</th>
    <th>Current</th><th>Unrealized</th><th>Stop</th><th>To stop</th></tr>${rows}</table>`;
}

// Ledger rows, parsed once per refresh and shared by the runs strip and the era
// table. timestamp_pt is ISO with a PT offset; its first 19 chars are PT
// wall-clock, which sorts and compares chronologically as a plain string --
// no Date parsing, so no dependence on the viewer's own timezone.
function parseLedger(csv) {
  const lines = csv.trim().split(/\r?\n/);
  const head = lines.shift().split(",");
  const i = Object.fromEntries(head.map((h, n) => [h, n]));
  for (const need of ["timestamp_pt", "side", "reason", "realized_pnl", "rules_version"]) {
    if (i[need] === undefined) {
      banner(`trade-ledger.csv is missing the "${need}" column — expected schema has changed.`);
      return null;
    }
  }
  return lines.map(l => l.split(",")).filter(f => f.length === head.length).map(f => ({
    ts: f[i.timestamp_pt].slice(0, 19), day: f[i.timestamp_pt].slice(0, 10),
    side: f[i.side], reason: f[i.reason], ver: f[i.rules_version],
    pnl: f[i.realized_pnl] === "" ? null : parseFloat(f[i.realized_pnl]),
  }));
}

// Compress the gate's own sentence to one token for the chip; the untouched
// sentence stays in the tooltip.
function skipLabel(reason) {
  for (const [re, label] of [[/blackout/i, "blackout"], [/\bSPY\b/i, "spy-red"],
                             [/pre-market/i, "pre-market"], [/after-hours|extended/i, "after-hours"],
                             [/buying power|MIN_ORDER_DOLLARS/i, "low buying power"]]) {
    if (re.test(reason || "")) return label;
  }
  return "no scan";
}

function tradeLabels(fills) {
  const out = [], name = { "dip-buy": "buy", "profit-take": "sell",
                           "stop-fill": "stop-sell", "dust-sweep": "dust" };
  for (const kind of ["dip-buy", "profit-take", "stop-fill", "dust-sweep"]) {
    const g = fills.filter(f => f.reason === kind);
    if (!g.length) continue;
    const n = g.length > 1 ? ` &times;${g.length}` : "";
    if (kind === "dip-buy") { out.push(`buy${n}`); continue; }
    const sum = g.reduce((s, f) => s + (f.pnl ?? 0), 0);
    out.push(`${name[kind]}${n} (<span class="${cls(sum)}">${sgn$(sum)}</span>)`);
  }
  return out;
}

async function renderRuns(statusNames, rows) {
  if (!statusNames.length) return;
  const today = statusNames[statusNames.length - 1].slice(13, 23); // YYYY_MM_DD of newest
  const todays = statusNames.filter(n => n.slice(13, 23) === today);
  // a fill belongs to the last run that had started before it
  const starts = todays.map(n => `${n.slice(13, 23).replace(/_/g, "-")}T${n.slice(24, 29).replace("_", ":")}:00`);
  const chips = await Promise.all(todays.map(async (n, k) => {
    try {
      const s = await getJSON("/run-reports/" + n);
      const phase = s.guards?.entry_phase ?? "?";
      const reason = s.guards?.entry_skip_reason;
      // the last run of the day still needs an upper bound, or it would sweep up
      // the next morning's fills in the window before that day's first snapshot
      const next = starts[k + 1] ?? `${today.replace(/_/g, "-")}T23:59:59`;
      const fills = (rows || []).filter(r => r.ts >= starts[k] && r.ts < next);
      const parts = tradeLabels(fills);
      // holdings management runs even when the scan does not, so a run can both
      // trade and report a skipped entry phase -- show both.
      if (phase === "skipped") parts.push(skipLabel(reason));
      else if (phase === "halted") parts.push("halted");
      else if (!parts.length) parts.push("scanned");
      const tip = reason || "entry phase ran — scan and evaluation performed";
      return `<span class="run ${esc(phase)}" title="${esc(tip)}">` +
             `<span class="t">${starts[k].slice(11, 16)}</span>` +
             `<span class="o">${parts.join(", ")}</span></span>`;
    } catch { return `<span class="run" title="unreadable"><span class="t">?</span>` +
                     `<span class="o">${esc(n)}</span></span>`; }
  }));
  $("runs").innerHTML = chips.join("");
}

function renderEras(rows) {
  if (!rows) return;
  const eras = new Map();
  for (const r of rows) {
    const e = eras.get(r.ver) ?? { buys: 0, sells: 0, stops: 0, sum: 0, first: r.day, last: r.day };
    if (r.side === "buy") e.buys++;
    if (r.side === "sell") e.sells++;
    if (r.reason === "stop-fill") e.stops++;
    if (r.pnl !== null) e.sum += r.pnl;
    if (r.day < e.first) e.first = r.day;
    if (r.day > e.last) e.last = r.day;
    eras.set(r.ver, e);
  }
  if (!eras.size) return;
  const ordered = [...eras]
    .sort((a, b) => b[1].last.localeCompare(a[1].last) || b[1].first.localeCompare(a[1].first));
  const dateSignature = JSON.stringify(
    ordered.map(([version, era]) => [version, era.first, era.last])
  );
  if (eraDateSignature !== null && dateSignature !== eraDateSignature) {
    erasExpanded = false;
  }
  eraDateSignature = dateSignature;
  const starCounts = new Map(
    ordered
      .map(([version, era], displayOrder) => ({ version, profit: era.sum, displayOrder }))
      .filter(era => era.profit > 0)
      .sort((a, b) => b.profit - a.profit || a.displayOrder - b.displayOrder)
      .slice(0, 3)
      .map((era, rank) => [era.version, 3 - rank])
  );
  const rankLabels = ["Largest", "Second-largest", "Third-largest"];
  const visible = erasExpanded ? ordered : ordered.slice(0, ERA_ROW_LIMIT);
  const trs = visible
    .map(([v, e]) => {
      const dates = e.first === e.last ? e.first : `${e.first} → ${e.last}`;
      const starCount = starCounts.get(v) ?? 0;
      const rank = starCount ? 3 - starCount : -1;
      const stars = starCount
        ? `<span class="profit-stars" role="img" aria-label="${rankLabels[rank]} realized profit" title="${rankLabels[rank]} realized profit">${"⭐".repeat(starCount)}</span>`
        : "";
      return `<tr><td>${esc(v)}</td><td>${dates}</td><td>${e.buys}</td><td>${e.sells}</td><td>${e.stops}</td><td class="${cls(e.sum)}">${stars}${fmt$(e.sum)}</td></tr>`;
    }).join("");
  const remaining = ordered.length - visible.length;
  const showMore = remaining
    ? `<button id="show-more-eras" class="show-more-eras" type="button">Click to show ${remaining} more...</button>`
    : "";
  $("eras").innerHTML = `<table><tr><th>rules_version</th><th>Dates</th><th>Buys</th><th>Sells</th><th>STOPs</th><th>Realized P&L</th></tr>${trs}</table>${showMore}`;
  $("show-more-eras")?.addEventListener("click", () => {
    erasExpanded = true;
    renderEras(rows);
  });
}

async function refresh() {
  try {
    $("banner").innerHTML = "";
    renderMode(await getJSON("/api/config"));
    const latest = await getJSON("/api/latest");
    if (latest.error) banner(`Newest snapshot ${latest.filename} is unreadable: ${latest.error}`);
    else if (latest.data) renderSnapshot(latest.data);
    const idx = await getJSON("/api/index");
    const rows = parseLedger(await (await fetch("/trade-ledger.csv", { cache: "no-store" })).text());
    await renderRuns(idx.status, rows);
    renderEras(rows);
    $("updated").textContent = "refreshed " + new Date().toLocaleTimeString();
  } catch (e) { banner("Dashboard failed to load: " + e); }
}

// runs land every ~30 min, so 30s polling is ample and costs only local reads.
// cache: no-store throughout, or the browser serves a stale snapshot forever.
refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
